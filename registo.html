:root{--bg:#f5f7fa;--card:#fff;--ink:#14202e;--mut:#5b6b7d;--line:#e3e8ef;--acc:#1f5eff;--ok:#12a150;--okb:#e6f6ec;--okt:#0b7a3b;--bad:#d93636;--badb:#fde9e9;--badt:#b02020;--info:#1f45b5;--infob:#e8efff;--na:#8a97a8;--nab:#eef1f5;--nat:#56657a;--r:14px;--head:rgba(255,255,255,.94);--actfg:#fff;color-scheme:light}

<h1 data-en="Protocol changelog">Registo de alterações do protocolo</h1>
<p class="lead" id="lead" hidden></p>
<div id="list"></div>
</main>
<script>
let LANG='pt';try{if(localStorage.getItem('lang')==='en')LANG='en'}catch(e){}
{const q=/[?&]lang=(en|pt)(?:&|#|$)/i.exec(location.search);if(q)LANG=q[1].toLowerCase()}
let DATA=null;
const L=(p,e)=>LANG==='en'?e:p;
const MES={pt:['','jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'],en:['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']};
const TIPOS={
 publicacao:{pt:'Publicação',en:'Published',k:'ok'},
 outra:{pt:'Outra',en:'Other',k:'na'},
 adicionado:{pt:'Adicionado',en:'Added',k:'ok'},adicao:{pt:'Adicionado',en:'Added',k:'ok'},novo:{pt:'Adicionado',en:'Added',k:'ok'},
 removido:{pt:'Removido',en:'Removed',k:'bad'},remocao:{pt:'Removido',en:'Removed',k:'bad'},
 alterado:{pt:'Alterado',en:'Changed',k:'info'},alteracao:{pt:'Alterado',en:'Changed',k:'info'},dose:{pt:'Dose',en:'Dose',k:'info'}
};
const BAN=/aconselhamento|n[ãa]o aplicada|ferramenta educativa|decidir com o m[ée]dico/i;
function okLine(s){return !!(s&&String(s).trim()&&!BAN.test(s))}
function tx(o){if(o==null)return '';if(typeof o==='string'||typeof o==='number')return String(o);if(Array.isArray(o))return o.map(tx).filter(Boolean).join(', ');return LANG==='en'?(o.en||o.pt||''):(o.pt||o.en||'')}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fdate(iso){const p=String(iso||'').split('-');if(p.length<3)return iso||'';const mon=MES[LANG==='en'?'en':'pt'][+p[1]]||p[1];return (+p[2])+' '+mon+' '+p[0]}
function badge(e){const slug=e.subtipo||e.tipo||'';const known=TIPOS[slug];if(known)return {t:L(known.pt,known.en),k:known.k};const raw=String(slug).replace(/[-_]/g,' ').trim();return {t:raw||L('Alteração','Change'),k:'na'}}
function render(){const list=document.getElementById('list'),lead=document.getElementById('lead');
 if(!DATA){return}
 const estado=tx(DATA.estado);
 if(okLine(estado)){lead.hidden=false;lead.textContent=estado}else{lead.hidden=true;lead.textContent=''}
 const rows=(DATA.entradas||[]).slice().sort((a,b)=>((b.data||'')+' '+(b.hora||'')).localeCompare((a.data||'')+' '+(a.hora||'')));
 const groups=[];
 rows.forEach(e=>{const d=e.data||'';const g=groups[groups.length-1];if(g&&g.data===d)g.items.push(e);else groups.push({data:d,aprox:!!e.data_aproximada,items:[e]})});
 list.replaceChildren();
 if(!groups.length){const p=document.createElement('p');p.className='mut';p.textContent=L('Sem alterações.','No changes.');list.appendChild(p);return}
 for(const g of groups){const sec=document.createElement('section');sec.className='day';
  const h=document.createElement('h2');h.textContent=(g.aprox?'≈ ':'')+fdate(g.data);sec.appendChild(h);
  for(const e of g.items){const art=document.createElement('article');art.className='entry';
   const meta=document.createElement('div');meta.className='meta';
   const b=badge(e);const pill=document.createElement('span');pill.className='pill '+b.k;pill.textContent=b.t;meta.appendChild(pill);
   if(e.hora){const hm=document.createElement('span');hm.className='small mut';hm.textContent=e.hora;meta.appendChild(hm)}
   art.appendChild(meta);
   const h3=document.createElement('h3');const item=tx(e.item);
   if(e.pagina&&/^[\w./-]+\.html$/.test(e.pagina)){const a=document.createElement('a');a.href=e.pagina;a.textContent=item;h3.appendChild(a)}else h3.textContent=item;
   art.appendChild(h3);
   const body=tx(e.texto);if(okLine(body)){const p=document.createElement('p');p.textContent=body;art.appendChild(p)}
   const antes=tx(e.antes),depois=tx(e.depois);
   if(okLine(antes)||okLine(depois)){const ba=document.createElement('div');ba.className='ba';
    if(okLine(antes)){const d=document.createElement('div');const lab=document.createElement('b');lab.textContent=L('Antes','Before');d.appendChild(lab);d.appendChild(document.createTextNode(antes));ba.appendChild(d)}
    if(okLine(depois)){const d=document.createElement('div');const lab=document.createElement('b');lab.textContent=L('Depois','After');d.appendChild(lab);d.appendChild(document.createTextNode(depois));ba.appendChild(d)}
    art.appendChild(ba)}
   sec.appendChild(art)}
  list.appendChild(sec)}}
function applyLang(){const en=LANG==='en';document.documentElement.lang=en?'en':'pt-PT';document.title=en?document.body.dataset.titleEn:document.body.dataset.titlePt;
 document.querySelectorAll('[data-en]').forEach(el=>{if(!el.hasAttribute('data-pt'))el.setAttribute('data-pt',el.textContent);el.textContent=en?el.dataset.en:el.dataset.pt});
 document.querySelectorAll('[data-al-en]').forEach(el=>{if(!el.hasAttribute('data-al-pt'))el.setAttribute('data-al-pt',el.getAttribute('aria-label'));el.setAttribute('aria-label',en?el.dataset.alEn:el.dataset.alPt)});
 document.querySelectorAll('#lang button').forEach(b=>{const on=b.dataset.l===LANG;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
 render()}
document.querySelectorAll('#lang button').forEach(b=>b.addEventListener('click',()=>{if(LANG===b.dataset.l)return;LANG=b.dataset.l;try{localStorage.setItem('lang',LANG)}catch(e){}try{if(/[?&]lang=/i.test(location.search)){const u=new URL(location.href);u.searchParams.set('lang',LANG);history.replaceState(history.state,'',u)}}catch(e){}applyLang()}));
let THEME=null;try{THEME=localStorage.getItem('theme')}catch(e){}
const curTheme=()=>THEME==='dark'||THEME==='light'?THEME:'dark';
function applyTheme(){const t=curTheme();document.documentElement.setAttribute('data-theme',t);document.querySelectorAll('#theme button').forEach(b=>{const on=b.dataset.t===t;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)})}
document.querySelectorAll('#theme button').forEach(b=>b.addEventListener('click',()=>{THEME=b.dataset.t;try{localStorage.setItem('theme',THEME)}catch(e){}applyTheme()}));
applyTheme();
applyLang();
fetch('data/registo.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(d=>{DATA=d;render()}).catch(()=>{document.getElementById('list').textContent=L('Não foi possível carregar os dados.','Could not load the data.')});
</script>
<script>
(function(){try{var W=window.SF_W;if(!W)return;W=String(W).replace(/\/+$/,'');
 if(location.hash==='#toggle-goatcounter'){var off=localStorage.getItem('skipgc')==='t';if(off)localStorage.removeItem('skipgc');else localStorage.setItem('skipgc','t');alert(off?'Contagem ligada neste browser.':'Contagem desligada neste browser.')}
 if(localStorage.getItem('skipgc')==='t'||navigator.webdriver||window!==window.top||location.protocol==='file:'||/^(localhost|127\.|10\.|192\.168\.|0\.0\.0\.0$|\[::1\]$)/.test(location.hostname))return;
 var send=function(){try{var sc=window.screen||{},x={p:location.pathname,t:document.title,r:document.referrer||'',s:sc.width||0,w:sc.width||0,h:sc.height||0,d:window.devicePixelRatio||0,m:navigator.maxTouchPoints||0},u=W+'/e',ok=0,
  go=function(){if(ok)return;ok=1;var d=JSON.stringify(x);if(navigator.sendBeacon&&navigator.sendBeacon(u,d))return;fetch(u,{method:'POST',body:d,keepalive:true,mode:'no-cors',credentials:'omit'}).catch(function(){})},
  ud=navigator.userAgentData;
  if(ud&&ud.getHighEntropyValues){setTimeout(go,800);ud.getHighEntropyValues(['model','platformVersion']).then(function(v){if(v&&v.model)x.mo=String(v.model).slice(0,40);if(v&&v.platformVersion)x.pv=String(v.platformVersion).slice(0,20);go()},go)}else go()}catch(_){}};
 if(document.visibilityState==='prerender')document.addEventListener('visibilitychange',function f(){if(document.visibilityState!=='prerender'){document.removeEventListener('visibilitychange',f);send()}});
 else if(document.readyState==='complete')send();else addEventListener('load',send)}catch(_){}})();
</script>
<script>document.addEventListener('click',function(e){document.querySelectorAll('details.dd[open]').forEach(function(d){if(!d.contains(e.target))d.removeAttribute('open')})});</script>
