<style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#14202e;--mut:#5b6b7d;--line:#e3e8ef;--acc:#1f5eff;--ok:#12a150;--okb:#e6f6ec;--warn:#d98a00;--warnb:#fff4dc;--bad:#d93636;--badb:#fde9e9;--na:#8a97a8;--nab:#eef1f5;--r:14px;--head:rgba(255,255,255,.94);--th:#fafbfd;--hov:#fafcff;--okt:#0b7a3b;--warnt:#9a5f00;--badt:#b02020;--nat:#56657a;--infob:#e8efff;--infot:#1f45b5;--noteb:#f0f5ff;--notel:#d7e3ff;--vok:#eefaf2;--vwarn:#fff6e3;--vwarnt:#8f5800;--vbad:#fdeeee;--vna:#3b4a5c;--open:#f3f7ff;--det:#fbfcfe;--grid:#eef1f5;--chok:#e6f6ec;--actfg:#fff;--hero1:#0f2747;--hero2:#1f5eff;color-scheme:light}
*{box-sizing:border-box}

.pill.ok{background:var(--okb);color:var(--okt)}.pill.warn{background:var(--warnb);color:var(--warnt)}.pill.bad{background:var(--badb);color:var(--badt)}.pill.na{background:var(--nab);color:var(--nat)}.pill.info{background:var(--infob);color:var(--infot)}
table{width:100%;border-collapse:collapse;font-size:13.5px}

.await{display:inline-flex;gap:6px;align-items:center;background:var(--nab);color:var(--vna);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600}
th.dcol,td.v,td.dl{text-align:right}

td.v.ok{background:var(--vok);color:var(--okt)}td.v.warn{background:var(--vwarn);color:var(--vwarnt)}td.v.bad{background:var(--vbad);color:var(--badt)}td.v.na{color:var(--vna)}
td.v.miss{color:var(--na);font-weight:500}
th.dcol small{display:block;font-weight:500;text-transform:none;letter-spacing:0;color:var(--mut)}
th.dcol.a{color:var(--ink)}
.tr{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}.tr small{font-weight:500;margin-left:4px}
.tr.good{color:var(--ok)}.tr.bad{color:var(--bad)}.tr.neu{color:var(--mut)}
tr.mk{cursor:pointer}tr.mk td:first-child b:after{content:" ▸";color:var(--na);font-weight:400}
tr.mk.open td:first-child b:after{content:" ▾"}
tr.mk.open td{background:var(--open)}
tr.det>td{background:var(--det);padding:12px 14px}

.det .in{position:sticky;left:0;max-width:min(980px,calc(100vw - 72px))}
.det .chartwrap{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.det svg{width:100%;max-width:560px;height:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;flex:1 1 320px}
.det table{font-size:12.5px;flex:1 1 280px;width:auto}
.det table td,.det table th{padding:5px 8px;position:static}
.det .msg{margin:8px 0 0}
@media(max-width:640px){.ctrl select{flex:1 1 100%}}
@media print{header.top{position:static}.tw.tall{max-height:none}}

--head:rgba(16,22,32,.92);--th:#1b2431;--hov:#1b2432;--okt:#63d99a;--warnt:#f2bf6b;--badt:#ff8f8f;--nat:#aeb9c8;--infob:#1d2a4a;--infot:#a3bcff;--noteb:#152038;--notel:#2a3b63;--vok:#13301f;--vwarn:#33280f;--vwarnt:#f2bf6b;--vbad:#3a1b1e;--vna:#c5cedb;--open:#1a2640;--det:#121923;--grid:#263142;--chok:#143524;--actfg:#0e141d;--hero1:#0b1a31;--hero2:#1c3f9e}

main a{color:var(--acc)}
.secnav{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 16px}.secnav a{padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);text-decoration:none;font-size:13px}.secnav a:hover{background:var(--nab)}
footer a{color:var(--acc)}
html[lang="en"] .l-pt{display:none}html:not([lang="en"]) .l-en{display:none}
.tools{display:flex;align-items:center;gap:14px;margin-left:auto;flex:0 0 auto}
.lang{display:flex;align-items:center;gap:4px;font-size:13.5px;white-space:nowrap}
.lang button{font:inherit;border:0;background:none;color:var(--mut);cursor:pointer;padding:6px 6px;border-radius:8px}
.lang button:hover{background:var(--nab);color:var(--ink)}.lang button.on{color:var(--ink);font-weight:700}
.lang .sep{color:var(--na)}
@media(max-width:640px){html{scroll-padding-top:136px}.topin{gap:4px 8px;padding:6px 12px;flex-wrap:wrap}.tools{order:-1;margin-left:auto;gap:10px}nav.main{flex:1 1 100%;order:2;flex-wrap:wrap;overflow:visible;gap:2px}nav.main a{padding:6px 10px}.lang{font-size:12.5px}.lang button{padding:5px 3px}}
.btn{display:inline-block;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);text-decoration:none;font-size:14px;font-weight:600}
.btn:hover{background:var(--nab)}main a.btn{color:var(--ink)}
main a.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--actfg)}main a.btn.pri:hover{filter:brightness(1.08)}
.kpi .k{font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:var(--mut);font-weight:700}
.kpi .v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.4px;margin-top:2px}

.chart svg{display:block;width:100%;height:auto}

<main>
<div class="hero">
<div><h1><span class="l-pt">Estatísticas</span><span class="l-en">Statistics</span></h1>
<p>Sérgio F · M</p></div>
<div class="meta" id="sMeta"><span class="l-pt">A carregar…</span><span class="l-en">Loading…</span></div>
</div>
<div id="sBody"><div class="card mut"><span class="l-pt">A carregar data/estatisticas.json…</span><span class="l-en">Loading data/estatisticas.json…</span></div></div>
</main>

<script>
// ===== página de estatísticas (escondida): lê data/estatisticas.json (GoatCounter, agregado, sem dados pessoais) e data/reports.json (títulos) =====
let LANG='pt';try{if(localStorage.getItem('lang')==='en')LANG='en'}catch(e){}
const L=(p,e)=>LANG==='en'?e:p;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T=o=>o==null?'':typeof o==='string'?o:(LANG==='en'&&o.en?o.en:(o.pt||''));
const SRC='data/estatisticas.json',RSRC='data/reports.json';
let S=null,SERR=null,RD=null,DIAS=30;
const N=n=>{const v=Math.max(0,Math.round(Number(n)||0));return v.toLocaleString(LANG==='en'?'en-GB':'pt-PT')};
const arr=x=>Array.isArray(x)?x:[];
// hora legal de Portugal continental (UTC+0; UTC+1 do último domingo de março ao último domingo de outubro, às 01:00 UTC)
function horaPT(iso){const d=new Date(iso);if(!iso||isNaN(d))return '';const y=d.getUTCFullYear();
 const ult=m=>{const x=new Date(Date.UTC(y,m+1,0,1));x.setUTCDate(x.getUTCDate()-x.getUTCDay());return x};
 const t=new Date(d.getTime()+(d>=ult(2)&&d<ult(9)?3600e3:0)),p=n=>String(n).padStart(2,'0');
 return `${p(t.getUTCDate())}-${p(t.getUTCMonth()+1)}-${t.getUTCFullYear()} ${p(t.getUTCHours())}:${p(t.getUTCMinutes())}`}
const fdia=d=>String(d).slice(0,10).split('-').reverse().join('-');
let DN=null;function pais(id,nome){try{if(!DN||DN.l!==LANG){DN=new Intl.DisplayNames([LANG==='en'?'en':'pt-PT'],{type:'region'});DN.l=LANG}const c=String(id||'').toUpperCase();if(/^[A-Z]{2}$/.test(c)){const n=DN.of(c);if(n&&n!==c)return n}}catch(e){}return nome||id||L('(desconhecido)','(unknown)')}
const TAM={phone:['Telemóveis','Phones'],largephone:['Telemóveis grandes / tablets pequenos','Large phones / small tablets'],tablet:['Tablets e portáteis pequenos','Tablets and small laptops'],desktop:['Computadores','Computers'],desktophd:['Computadores (ecrã grande)','Computers (large screen)'],unknown:['(desconhecido)','(unknown)']};
const tam=(id,nome)=>TAM[id]?L(TAM[id][0],TAM[id][1]):(nome||id);
const nm=n=>n==='(oculto)'?L('(oculto)','(hidden)'):n==='(desconhecido)'?L('(desconhecido)','(unknown)'):n;
function tabela(titulo,cab,linhas,vazio){return `<div class="card"><h3 style="margin-top:0">${titulo}</h3>`+(linhas.length?`<div class="tw"><table class="stbl"><thead><tr>${cab.map((c,i)=>`<th${i?' class="n"':''}>${c}</th>`).join('')}</tr></thead><tbody>${linhas.map(r=>`<tr>${r.map((c,i)=>`<td${i?' class="n"':''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:`<p class="mut small">${vazio||L('Sem dados.','No data.')}</p>`)+`</div>`}
function grafico(){const all=arr(S.dias).filter(x=>x&&x.dia),ds=all.slice(-DIAS);if(!ds.length)return `<p class="mut small">${L('Sem dados.','No data.')}</p>`;
 const W=760,H=220,pl=38,pr=8,pt=10,pb=26,iw=W-pl-pr,ih=H-pt-pb,mx=Math.max(1,...ds.map(x=>Number(x.visitas)||0));
 const st=Math.pow(10,Math.floor(Math.log10(mx))),nice=[1,2,5,10].map(k=>k*st).find(v=>mx/v<=4)||st*10,top=Math.ceil(mx/nice)*nice,bw=iw/ds.length;
 let g='';for(let v=0;v<=top;v+=nice){const y=pt+ih-ih*v/top;g+=`<line class="ax" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${N(v)}</text>`}
 const b=ds.map((x,i)=>{const v=Number(x.visitas)||0,h=ih*v/top;return `<rect class="vbar" x="${(pl+i*bw+bw*.15).toFixed(1)}" y="${(pt+ih-h).toFixed(1)}" width="${Math.max(1,bw*.7).toFixed(1)}" height="${h.toFixed(1)}"><title>${fdia(x.dia)}: ${N(v)}</title></rect>`}).join('');
 const ix=[0,Math.floor((ds.length-1)/2),ds.length-1].filter((v,i,a)=>a.indexOf(v)===i);
 const lx=ix.map(i=>`<text x="${(pl+i*bw+bw/2).toFixed(1)}" y="${H-8}" text-anchor="${i===0&&ds.length>1?'start':i===ds.length-1&&ds.length>1?'end':'middle'}">${fdia(ds[i].dia).slice(0,5)}</text>`).join('');
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${L('Visitas por dia','Visits per day')}">${g}${b}${lx}</svg>`}
function render(){const box=document.getElementById('sBody'),meta=document.getElementById('sMeta');
 if(SERR){meta.textContent=L('Sem dados','No data');box.innerHTML=`<div class="card mut">${L('Não foi possível carregar','Could not load')} ${esc(SRC)} (${esc(SERR.message)}).</div>`;return}
 if(!S)return;const tt=S.total||{},rel=arr(S.relatorios);
 meta.innerHTML=S.atualizado_em?`${L('Atualizado em','Updated on')} ${esc(horaPT(S.atualizado_em))} (PT)`:L('Ainda sem dados','No data yet');
 const temDados=!!S.atualizado_em&&((Number(tt.visitas)||0)>0||(Number(tt.aberturas_pdf)||0)>0||rel.length>0);
 if(!temDados){box.innerHTML=`<div class="card empty"><b>${L('Ainda não há estatísticas','No statistics yet')}</b><span class="mut">${L('Os números aparecem aqui depois das primeiras visitas; a atualização é automática, de hora a hora.','The numbers show up here after the first visits; they are updated automatically every hour.')}</span></div>`;return}
 const M={};arr(RD&&RD.relatorios).forEach(r=>{if(r&&r.id)M[r.id]=r});
 const tit=r=>r.id&&M[r.id]?esc(T(M[r.id].titulo)):esc(r.ficheiro||r.id||'?');
 const kp=(k,v,s)=>`<div class="card kpi"><div class="k">${k}</div><div class="v">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`;
 const rs=rel.slice().sort((a,b)=>(Number(b.total)||0)-(Number(a.total)||0)||tit(a).localeCompare(tit(b)));
 box.innerHTML=`<section><div class="grid g4">`+kp(L('Visitas','Visits'),N(tt.visitas),S.desde?`${L('desde','since')} ${esc(fdia(S.desde))}`:'')+kp(L('Últimos 30 dias','Last 30 days'),N(tt.visitas_30d))+kp(L('Últimos 90 dias','Last 90 days'),N(tt.visitas_90d))+kp(L('Aberturas de PDFs','PDF opens'),N(tt.aberturas_pdf),L('aberturas e downloads','opens and downloads'))+`</div></section>`+
  `<section><div class="card chart"><div class="chead"><h3 style="margin:0">${L('Visitas por dia','Visits per day')}</h3><div class="seg" id="sDias" role="group" aria-label="${L('Período','Period')}"><button type="button" data-d="30" class="${DIAS===30?'on':''}" aria-pressed="${DIAS===30}">${L('30 dias','30 days')}</button><button type="button" data-d="90" class="${DIAS===90?'on':''}" aria-pressed="${DIAS===90}">${L('90 dias','90 days')}</button></div></div>${grafico()}</div></section>`+
  `<section>`+tabela(L('Relatórios mais abertos','Most opened reports'),[L('Relatório','Report'),'PT','EN','Total'],rs.map(r=>[tit(r),N(r.pt),N(r.en),`<b>${N(r.total)}</b>`]),L('Ainda nenhum PDF aberto.','No PDF opened yet.'))+`</section>`+
  `<section><div class="grid g2">`+tabela(L('Páginas mais vistas','Most viewed pages'),[L('Página','Page'),L('Visitas','Visits')],arr(S.paginas).map(p=>[esc(p.path),N(p.visitas)]))+
  tabela(L('Países','Countries'),[L('País','Country'),L('Visitas','Visits')],arr(S.paises).map(p=>[esc(pais(p.id,p.nome)),N(p.visitas)]))+
  tabela(L('Aparelhos (ecrã)','Devices (screen)'),[L('Aparelho','Device'),L('Visitas','Visits')],arr(S.tamanhos).map(p=>[esc(tam(p.id,p.nome)),N(p.visitas)]))+
  tabela(L('Browsers','Browsers'),['Browser',L('Visitas','Visits')],arr(S.browsers).map(p=>[esc(nm(p.nome)),N(p.visitas)]))+

 document.querySelectorAll('#sDias button').forEach(b=>b.addEventListener('click',()=>{DIAS=Number(b.dataset.d);render()}))}
function applyLang(){const en=LANG==='en';document.documentElement.lang=en?'en':'pt-PT';document.title=en?document.body.dataset.titleEn:document.body.dataset.titlePt;
 document.querySelectorAll('[data-en]').forEach(el=>{if(!el.hasAttribute('data-pt'))el.setAttribute('data-pt',el.textContent);el.textContent=en?el.dataset.en:el.dataset.pt});
 document.querySelectorAll('[data-al-en]').forEach(el=>{if(!el.hasAttribute('data-al-pt'))el.setAttribute('data-al-pt',el.getAttribute('aria-label'));el.setAttribute('aria-label',en?el.dataset.alEn:el.dataset.alPt)});
 document.querySelectorAll('#lang button').forEach(b=>{const on=b.dataset.l===LANG;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});render()}
document.querySelectorAll('#lang button').forEach(b=>b.addEventListener('click',()=>{if(LANG===b.dataset.l)return;LANG=b.dataset.l;try{localStorage.setItem('lang',LANG)}catch(e){}applyLang()}));
applyLang();
const get=u=>fetch(u,{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(u+': HTTP '+r.status);return r.json()});
get(RSRC).then(d=>{RD=d}).catch(e=>{RD={relatorios:[]}}).then(()=>get(SRC)).then(d=>{if(!d||typeof d!=='object')throw new Error(SRC+': JSON');S=d;render()}).catch(e=>{if(!S){SERR=e;render()}});

// ===== tema (escuro/claro): escolha guardada em localStorage 'theme'; sem escolha, escuro (o default, seja qual for o tema do sistema; aplicado no <head> antes do primeiro desenho) =====
let THEME=null;try{THEME=localStorage.getItem('theme')}catch(e){}
const curTheme=()=>THEME==='dark'||THEME==='light'?THEME:'dark';
function applyTheme(){const t=curTheme();document.documentElement.setAttribute('data-theme',t);document.querySelectorAll('#theme button').forEach(b=>{const on=b.dataset.t===t;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)})}
document.querySelectorAll('#theme button').forEach(b=>b.addEventListener('click',()=>{THEME=b.dataset.t;try{localStorage.setItem('theme',THEME)}catch(e){}applyTheme()}));
applyTheme();
</script>
