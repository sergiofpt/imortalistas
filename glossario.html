<style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#14202e;--mut:#5b6b7d;--line:#e3e8ef;--acc:#1f5eff;--na:#8a97a8;--nab:#eef1f5;--r:14px;--head:rgba(255,255,255,.94);--actfg:#fff;color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:78px}
body{margin:0;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
header.top{position:sticky;top:0;z-index:50;background:var(--head);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line)}
.topin{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:10px 20px}
nav.main{display:flex;gap:4px;overflow:visible;scrollbar-width:none;flex:1;min-width:0}
nav.main::-webkit-scrollbar{display:none}
nav.main a{white-space:nowrap;text-decoration:none;color:var(--mut);font-size:13.5px;padding:7px 11px;border-radius:999px;font-weight:500}
nav.main a:hover{background:var(--nab);color:var(--ink)}
nav.main a.active{background:var(--ink);color:var(--actfg)}
.dd{position:relative;flex:0 0 auto}
.dd summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;white-space:nowrap;color:var(--mut);font:inherit;font-size:13.5px;font-weight:500;padding:7px 11px;border-radius:999px}
.dd summary::-webkit-details-marker{display:none}
.dd summary::marker{content:""}
.dd summary:hover,.dd[open]>summary{background:var(--nab);color:var(--ink)}
.dd.on>summary{background:var(--ink);color:var(--actfg)}
.dd summary:after{content:" ▾";font-size:.72em;opacity:.75}
.dd[open]>summary:after{content:" ▴"}
.ddmenu{position:absolute;top:calc(100% + 6px);right:0;min-width:210px;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 36px rgba(15,30,50,.18);z-index:80;display:flex;flex-direction:column;gap:2px}
.ddmenu a{display:block;border-radius:10px}

h1{margin:0 0 8px;font-size:28px;letter-spacing:-.3px}
.lead{margin:0 0 14px;color:var(--mut)}
.lead[hidden]{display:none}

.count{color:var(--mut);font-size:13px}
.az{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 14px}
.az button{font:inherit;font-size:13px;min-width:30px;padding:4px 0;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
.az button:hover{background:var(--nab)}
.az button.on{background:var(--ink);color:var(--actfg);border-color:var(--ink)}
.az button:disabled{opacity:.35;cursor:default}
.az button:focus{outline:2px solid var(--acc);outline-offset:1px}
.list{display:grid;gap:10px}
.term{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.term h2{font-size:17px;margin:0 0 6px;letter-spacing:-.2px}
.term p{margin:0 0 8px}
.term a{font-weight:600}
.empty{color:var(--mut);padding:8px 0}
.pager{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:16px 0 0}
.pager[hidden]{display:none}
.pager button{font:inherit;font-size:13.5px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer}
.pager button:hover{background:var(--nab)}
.pager button.on{background:var(--ink);color:var(--actfg);border-color:var(--ink)}
.pager button:disabled{opacity:.45;cursor:default}
.pager button:focus{outline:2px solid var(--acc);outline-offset:1px}
.pager .gap{color:var(--mut);padding:0 2px}
.pager .pstat{color:var(--mut);font-size:13px;margin-left:4px}
main a{color:var(--acc)}
html[data-theme="dark"]{color-scheme:dark;--bg:#0e141d;--card:#161e2a;--ink:#e5eaf1;--mut:#9aa7b8;--line:#2a3545;--acc:#7a9dff;--nab:#222b39;--head:rgba(16,22,32,.92);--actfg:#0e141d;--na:#7f8c9e}
html[lang="en"] .l-pt{display:none}html:not([lang="en"]) .l-en{display:none}
.tools{display:flex;align-items:center;gap:14px;margin-left:auto;flex:0 0 auto}
.lang{display:flex;align-items:center;gap:4px;font-size:13.5px;white-space:nowrap}
.lang button{font:inherit;border:0;background:none;color:var(--mut);cursor:pointer;padding:6px 6px;border-radius:8px}
.lang button:hover{background:var(--nab);color:var(--ink)}.lang button.on{color:var(--ink);font-weight:700}
.lang .sep{color:var(--na)}
@media(max-width:640px){html{scroll-padding-top:148px}.topin{gap:4px 8px;padding:6px 12px;flex-wrap:wrap}.tools{order:-1;margin-left:auto;gap:10px}nav.main{flex:1 1 100%;order:2;flex-wrap:wrap;gap:2px}nav.main a,.dd summary{padding:6px 10px}h1{font-size:24px}.term{padding:12px 14px}}
</style>

<main>
<h1 data-en="Glossary">Glossário</h1>
<p class="lead" id="lead" hidden></p>
<div class="filters">
<input id="q" type="search" autocomplete="off" spellcheck="false" data-ph-pt="Procurar termo" data-ph-en="Search terms" placeholder="Procurar termo" aria-label="Procurar termo" data-al-en="Search terms">
<span class="count" id="count"></span>
</div>
<div class="az" id="az" role="navigation" aria-label="A a Z" data-al-en="A to Z"></div>

</main>
<script>
let LANG='pt';try{if(localStorage.getItem('lang')==='en')LANG='en'}catch(e){}
{const q=/[?&]lang=(en|pt)(?:&|#|$)/i.exec(location.search);if(q)LANG=q[1].toLowerCase()}
let DATA=null,PAGE=1,LETTER='';
const PER=25;
const AZ='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const L=(p,e)=>LANG==='en'?e:p;
const BAN=/aconselhamento|n[ãa]o aplicada|ferramenta educativa|decidir com o m[ée]dico/i;
function okLine(s){return !!(s&&String(s).trim()&&!BAN.test(s))}
function tx(o){if(!o)return '';return LANG==='en'?(o.en||o.pt||''):(o.pt||o.en||'')}
function fold(s){return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function letterOf(termo){const c=(fold(termo).match(/[a-z]/)||['#'])[0];return c.toUpperCase()}
function terms(){return (DATA&&DATA.termos||[]).slice().sort((a,b)=>a.termo.localeCompare(b.termo,'pt',{sensitivity:'base',numeric:true}))}
function matched(){const q=fold(document.getElementById('q').value.trim());
 return terms().filter(t=>{if(LETTER&&letterOf(t.termo)!==LETTER)return false;if(!q)return true;
  const def=t.definicao||{};return fold([t.termo,def.pt||'',def.en||'',t.categoria||''].join(' ')).includes(q)})}
function pageItems(cur,total){const want=new Set([1,total,cur-1,cur,cur+1]);
 const nums=[...want].filter(n=>n>=1&&n<=total).sort((a,b)=>a-b),out=[];
 let prev=0;for(const n of nums){if(prev&&n-prev>1)out.push(0);out.push(n);prev=n}return out}
function drawPager(pages,scroll){const pager=document.getElementById('pager'),en=LANG==='en';
 pager.replaceChildren();
 if(pages<=1){pager.hidden=true;return}
 pager.hidden=false;
 const btn=(label,dis,fn)=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.disabled=dis;if(!dis)b.addEventListener('click',fn);return b};
 const go=n=>{if(n===PAGE||n<1||n>pages)return;PAGE=n;render({scroll:true})};
 pager.appendChild(btn(en?'Previous':'Anterior',PAGE<=1,()=>go(PAGE-1)));
 for(const n of pageItems(PAGE,pages)){if(!n){const s=document.createElement('span');s.className='gap';s.setAttribute('aria-hidden','true');s.textContent='…';pager.appendChild(s);continue}
  const b=btn(String(n),false,()=>go(n));if(n===PAGE){b.className='on';b.setAttribute('aria-current','page')}pager.appendChild(b)}
 pager.appendChild(btn(en?'Next':'Seguinte',PAGE>=pages,()=>go(PAGE+1)));
 const st=document.createElement('span');st.className='pstat';st.textContent=en?'Page '+PAGE+' of '+pages:'Página '+PAGE+' de '+pages;pager.appendChild(st);
 if(scroll)document.getElementById('list').scrollIntoView({block:'start'})}
function drawAz(){const bar=document.getElementById('az');const have=new Set(terms().map(t=>letterOf(t.termo)));
 bar.replaceChildren();
 for(const ch of AZ){const b=document.createElement('button');b.type='button';b.textContent=ch;b.disabled=!have.has(ch);
  if(LETTER===ch){b.className='on';b.setAttribute('aria-pressed','true')}else b.setAttribute('aria-pressed','false');
  b.addEventListener('click',()=>{LETTER=LETTER===ch?'':ch;if(LETTER)document.getElementById('q').value='';PAGE=1;render()});
  bar.appendChild(b)}}
function render(opt){const list=document.getElementById('list'),count=document.getElementById('count'),lead=document.getElementById('lead');
 drawAz();
 if(!DATA){list.textContent='';return}
 const note=tx(DATA.nota);
 if(okLine(note)){lead.hidden=false;lead.textContent=note}else{lead.hidden=true;lead.textContent=''}
 const all=terms(),rows=matched();
 const en=LANG==='en';
 count.textContent=en?(rows.length===all.length?all.length+' terms':rows.length+' of '+all.length+' terms'):(rows.length===all.length?all.length+' termos':rows.length+' de '+all.length+' termos');
 const pages=Math.max(1,Math.ceil(rows.length/PER));
 if(PAGE>pages)PAGE=1;
 const view=rows.slice((PAGE-1)*PER,PAGE*PER);
 list.replaceChildren();
 if(!rows.length){const p=document.createElement('p');p.className='empty';p.textContent=en?'No matching terms.':'Nenhum termo corresponde.';list.appendChild(p);drawPager(0);return}
 for(const t of view){const art=document.createElement('article');art.className='term';art.id='t-'+fold(t.termo).replace(/[^a-z0-9]+/g,'-');
  const h=document.createElement('h2');h.textContent=t.termo;art.appendChild(h);
  const p=document.createElement('p');p.textContent=tx(t.definicao);art.appendChild(p);
  if(t.ver){const a=document.createElement('a');a.href=t.ver;a.textContent=en?'see':'ver';art.appendChild(a)}
  list.appendChild(art)}
 drawPager(pages,opt&&opt.scroll)}
function applyLang(){const en=LANG==='en';document.documentElement.lang=en?'en':'pt-PT';document.title=en?document.body.dataset.titleEn:document.body.dataset.titlePt;
 document.querySelectorAll('[data-en]').forEach(el=>{if(!el.hasAttribute('data-pt'))el.setAttribute('data-pt',el.textContent);el.textContent=en?el.dataset.en:el.dataset.pt});
 document.querySelectorAll('[data-ph-en]').forEach(el=>{if(!el.hasAttribute('data-ph-pt'))el.setAttribute('data-ph-pt',el.placeholder);el.placeholder=en?el.dataset.phEn:el.dataset.phPt});
 document.querySelectorAll('[data-al-en]').forEach(el=>{if(!el.hasAttribute('data-al-pt'))el.setAttribute('data-al-pt',el.getAttribute('aria-label'));el.setAttribute('aria-label',en?el.dataset.alEn:el.dataset.alPt)});
 document.querySelectorAll('#lang button').forEach(b=>{const on=b.dataset.l===LANG;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
 render()}
document.getElementById('q').addEventListener('input',()=>{LETTER='';PAGE=1;render()});
document.querySelectorAll('#lang button').forEach(b=>b.addEventListener('click',()=>{if(LANG===b.dataset.l)return;LANG=b.dataset.l;try{localStorage.setItem('lang',LANG)}catch(e){}try{if(/[?&]lang=/i.test(location.search)){const u=new URL(location.href);u.searchParams.set('lang',LANG);history.replaceState(history.state,'',u)}}catch(e){}applyLang()}));
let THEME=null;try{THEME=localStorage.getItem('theme')}catch(e){}
const curTheme=()=>THEME==='dark'||THEME==='light'?THEME:'dark';
function applyTheme(){const t=curTheme();document.documentElement.setAttribute('data-theme',t);document.querySelectorAll('#theme button').forEach(b=>{const on=b.dataset.t===t;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)})}
document.querySelectorAll('#theme button').forEach(b=>b.addEventListener('click',()=>{THEME=b.dataset.t;try{localStorage.setItem('theme',THEME)}catch(e){}applyTheme()}));
applyTheme();
applyLang();
fetch('data/glossario.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(d=>{DATA=d;render()}).catch(()=>{document.getElementById('list').textContent=L('Não foi possível carregar os dados.','Could not load the data.')});
</script>
<script>
(function(){try{var W=window.SF_W;if(!W)return;W=String(W).replace(/\/+$/,'');
 if(location.hash==='#toggle-goatcounter'){var off=localStorage.getItem('skipgc')==='t';if(off)localStorage.removeItem('skipgc');else localStorage.setItem('skipgc','t');alert(off?'Contagem ligada neste browser.':'Contagem desligada neste browser.')}
 if(localStorage.getItem('skipgc')==='t'||navigator.webdriver||window!==window.top||location.protocol==='file:'||/^(localhost|127\.|10\.|192\.168\.|0\.0\.0\.0$|\[::1\]$)/.test(location.hostname))return;
 var send=function(){try{var sc=window.screen||{},x={p:location.pathname,t:document.title,r:document.referrer||'',s:sc.width||0,w:sc.width||0,h:sc.height||0,d:window.devicePixelRatio||0,m:navigator.maxTouchPoints||0},u=W+'/e',ok=0,
  go=function(){if(ok)return;ok=1;var d=JSON.stringify(x);if(navigator.sendBeacon&&navigator.sendBeacon(u,d))return;fetch(u,{method:'POST',body:d,keepalive:true,mode:'no-cors',credentials:'omit'}).catch(function(){})},
  ud=navigator.userAgentData;
  if(ud&&ud.getHighEntropyValues){setTimeout(go,800);ud.getHighEntropyValues(['model','platformVersion']).then(function(v){if(v&&v.model)x.mo=String(v.model).slice(0,40);if(v&&v.platformVersion)x.pv=String(v.platformVersion).slice(0,20);go()},go)}else go()}catch(_){}};
 if(document.visibilityState==='prerender')document.addEventListener('visibilitychange',function f(){if(document.visibilityState!=='prerender'){document.removeEventListener('visibilitychange',f);send()}});
 else if(document.readyState==='complete')send();else addEventListener('load',send)}catch(_){}})();
</script>
<script>document.addEventListener('click',function(e){document.querySelectorAll('details.dd[open]').forEach(function(d){if(!d.contains(e.target))d.removeAttribute('open')})});</script>
