.lang button:hover{background:var(--nab);color:var(--ink)}.lang button.on{color:var(--ink);font-weight:700}
.lang .sep{color:var(--na)}
main{max-width:760px;margin:0 auto;padding:28px 20px 72px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 26px 24px}

<script>
let LANG='pt';try{if(localStorage.getItem('lang')==='en')LANG='en'}catch(e){}
{const q=/[?&]lang=(en|pt)(?:&|#|$)/i.exec(location.search);if(q)LANG=q[1].toLowerCase()}
const L=(p,e)=>LANG==='en'?e:p;
const optOut=()=>{try{return localStorage.getItem('sf_nao_contar')==='1'}catch(e){return false}};
function paint(){const nao=optOut(),box=document.getElementById('box'),en=LANG==='en';
 document.documentElement.lang=en?'en':'pt-PT';
 document.title=en?document.body.dataset.titleEn:document.body.dataset.titlePt;
 box.classList.toggle('off',nao);box.classList.toggle('on',!nao);
 document.getElementById('estado').textContent=nao?L('Este aparelho NÃO conta nas estatísticas','This device is NOT counted in the statistics'):L('Este aparelho conta nas estatísticas','This device is counted in the statistics');
 document.getElementById('hint').textContent=L('A escolha fica neste browser.','The choice stays in this browser.');
 const a=document.getElementById('bOff'),b=document.getElementById('bOn');
 a.textContent=L('Não contar','Do not count');b.textContent=L('Contar','Count');
 a.classList.toggle('on',nao);b.classList.toggle('on',!nao);
 a.setAttribute('aria-pressed',nao);b.setAttribute('aria-pressed',!nao);
 document.querySelectorAll('#lang button').forEach(btn=>{const on=btn.dataset.l===LANG;btn.classList.toggle('on',on);btn.setAttribute('aria-pressed',on)});
 document.querySelectorAll('[data-en]').forEach(el=>{if(!el.hasAttribute('data-pt'))el.setAttribute('data-pt',el.textContent);el.textContent=en?el.dataset.en:el.dataset.pt});
 document.querySelectorAll('[data-al-en]').forEach(el=>{if(!el.hasAttribute('data-al-pt'))el.setAttribute('data-al-pt',el.getAttribute('aria-label'));el.setAttribute('aria-label',en?el.dataset.alEn:el.dataset.alPt)})}
document.getElementById('bOff').addEventListener('click',()=>{try{localStorage.setItem('sf_nao_contar','1')}catch(e){}paint()});
document.getElementById('bOn').addEventListener('click',()=>{try{localStorage.removeItem('sf_nao_contar')}catch(e){}paint()});
document.querySelectorAll('#lang button').forEach(b=>b.addEventListener('click',()=>{if(LANG===b.dataset.l)return;LANG=b.dataset.l;try{localStorage.setItem('lang',LANG)}catch(e){}paint()}));
paint();
let THEME=null;try{THEME=localStorage.getItem('theme')}catch(e){}
const curTheme=()=>THEME==='dark'||THEME==='light'?THEME:'dark';
function applyTheme(){const t=curTheme();document.documentElement.setAttribute('data-theme',t);document.querySelectorAll('#theme button').forEach(b=>{const on=b.dataset.t===t;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)})}
document.querySelectorAll('#theme button').forEach(b=>b.addEventListener('click',()=>{THEME=b.dataset.t;try{localStorage.setItem('theme',THEME)}catch(e){}applyTheme()}));
applyTheme();
</script>
<script>document.addEventListener('click',function(e){document.querySelectorAll('details.dd[open]').forEach(function(d){if(!d.contains(e.target))d.removeAttribute('open')})});</script>
